[project]
name = "marvin-agent"
version = "0.1.0"
description = "Marvin - CLI task assistant for academic PIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.0",
]

[project.scripts]
marvin = "marvin.cli:main"
marvin-mcp = "marvin.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin"]
